<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Malaysia: The Mandate. A work of political fiction. Govern Malaysia as Prime Minister in a narrative simulation of coalition, economy and legacy."
    />
    <meta name="theme-color" content="#101722" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Malaysia: The Mandate</title>
    <script>
      /* Apply persisted scheme before first paint to avoid a flash. Dark is the default. */
      try {
        var raw = localStorage.getItem("mtm:ui:v2");
        var theme = raw ? JSON.parse(raw).state.theme : null;
        if (theme === "paper") document.documentElement.classList.add("theme-paper");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
