<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised illustration of the Putrajaya federal district at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="0.55" stop-color="#101722"/>
      <stop offset="0.85" stop-color="#1a2130"/>
      <stop offset="1" stop-color="#2a2a2e"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#c9a96a" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#c9a96a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c9a96a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6cd8e" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#c9a96a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9a96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#202631" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2b3341" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#202631" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1440" height="600" fill="url(#sky)"/>
  <rect y="330" width="1440" height="270" fill="url(#horizonGlow)"/>

  <!-- sparse stars -->
  <g fill="#e9e2d2">
    <circle cx="180" cy="70" r="1.1" opacity="0.5"/>
    <circle cx="420" cy="120" r="0.9" opacity="0.35"/>
    <circle cx="760" cy="60" r="1.2" opacity="0.55"/>
    <circle cx="980" cy="140" r="0.9" opacity="0.3"/>
    <circle cx="1240" cy="90" r="1.1" opacity="0.45"/>
    <circle cx="1350" cy="180" r="0.8" opacity="0.3"/>
    <circle cx="300" cy="200" r="0.8" opacity="0.25"/>
  </g>

  <!-- monsoon clouds -->
  <g>
    <ellipse cx="330" cy="160" rx="260" ry="34" fill="url(#cloud)" opacity="0.7"/>
    <ellipse cx="1020" cy="210" rx="330" ry="40" fill="url(#cloud)" opacity="0.55"/>
    <ellipse cx="700" cy="120" rx="380" ry="30" fill="url(#cloud)" opacity="0.4"/>
  </g>

  <!-- far ministry blocks -->
  <g fill="#151b26">
    <rect x="0" y="392" width="1440" height="208"/>
    <rect x="40" y="344" width="86" height="70"/>
    <rect x="150" y="366" width="54" height="48"/>
    <rect x="300" y="356" width="72" height="58"/>
    <rect x="1100" y="350" width="64" height="64"/>
    <rect x="1210" y="336" width="48" height="78"/>
    <rect x="1300" y="368" width="90" height="46"/>
  </g>
  <!-- far windows -->
  <g fill="#c9a96a" opacity="0.5">
    <rect x="56" y="358" width="6" height="8"/>
    <rect x="72" y="358" width="6" height="8"/>
    <rect x="88" y="374" width="6" height="8"/>
    <rect x="163" y="378" width="6" height="8"/>
    <rect x="316" y="368" width="6" height="8"/>
    <rect x="336" y="384" width="6" height="8"/>
    <rect x="1116" y="362" width="6" height="8"/>
    <rect x="1136" y="378" width="6" height="8"/>
    <rect x="1226" y="350" width="6" height="8"/>
    <rect x="1330" y="380" width="6" height="8"/>
    <rect x="1354" y="396" width="6" height="8"/>
  </g>

  <!-- the domed complex: Perdana Putra -->
  <g fill="#0e141e">
    <rect x="540" y="416" width="360" height="140"/>
    <path d="M624 416c0-52 40-96 96-96s96 44 96 96z"/>
    <rect x="712" y="288" width="8" height="36"/>
    <circle cx="716" cy="284" r="5" fill="#c9a96a" opacity="0.85"/>
    <!-- minarets -->
    <rect x="512" y="300" width="16" height="256"/>
    <path d="M512 300c0-16 4-28 8-28s8 12 8 28z"/>
    <rect x="912" y="300" width="16" height="256"/>
    <path d="M912 300c0-16 4-28 8-28s8 12 8 28z"/>
    <!-- wings -->
    <rect x="440" y="440" width="100" height="116"/>
    <rect x="900" y="440" width="100" height="116"/>
  </g>
  <!-- gold rim light on the dome -->
  <path d="M624 416c0-52 40-96 96-96s96 44 96 96" fill="none" stroke="#c9a96a" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M512 300c0-16 4-28 8-28s8 12 8 28M912 300c0-16 4-28 8-28s8 12 8 28" fill="none" stroke="#c9a96a" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- lit windows of the complex -->
  <g fill="#e6cd8e" opacity="0.75">
    <rect x="576" y="452" width="9" height="14"/>
    <rect x="604" y="452" width="9" height="14"/>
    <rect x="660" y="452" width="9" height="14"/>
    <rect x="772" y="452" width="9" height="14"/>
    <rect x="828" y="452" width="9" height="14"/>
    <rect x="856" y="452" width="9" height="14"/>
    <rect x="632" y="488" width="9" height="14"/>
    <rect x="700" y="488" width="9" height="14"/>
    <rect x="744" y="488" width="9" height="14"/>
    <rect x="812" y="488" width="9" height="14"/>
    <rect x="468" y="470" width="8" height="12"/>
    <rect x="500" y="470" width="8" height="12"/>
    <rect x="928" y="470" width="8" height="12"/>
    <rect x="960" y="470" width="8" height="12"/>
  </g>

  <!-- boulevard and forecourt -->
  <rect y="556" width="1440" height="44" fill="#080b10"/>
  <rect y="554" width="1440" height="2" fill="#c9a96a" opacity="0.5"/>
  <!-- lamps -->
  <g>
    <circle cx="240" cy="540" r="34" fill="url(#lamp)"/>
    <circle cx="1200" cy="540" r="34" fill="url(#lamp)"/>
    <circle cx="716" cy="536" r="26" fill="url(#lamp)" opacity="0.7"/>
    <rect x="238" y="540" width="3" height="20" fill="#0e141e"/>
    <rect x="1198" y="540" width="3" height="20" fill="#0e141e"/>
  </g>

  <!-- wet road reflections -->
  <g fill="#c9a96a" opacity="0.14">
    <rect x="232" y="566" width="16" height="30"/>
    <rect x="1192" y="566" width="16" height="30"/>
    <rect x="710" y="562" width="12" height="34"/>
  </g>
</svg>
