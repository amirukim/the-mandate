<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised illustration of the Prime Minister's office: desk with red folders, telephone and newspaper, wall map of Malaysia, globe, safe, framed parliament picture, party standard, clock and bookshelf">
  <defs>
    <linearGradient id="h-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1812"/>
      <stop offset="0.6" stop-color="#161209"/>
      <stop offset="1" stop-color="#100d08"/>
    </linearGradient>
    <radialGradient id="h-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6cd8e" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#c9a96a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9a96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141009"/>
      <stop offset="1" stop-color="#262033"/>
    </linearGradient>
    <linearGradient id="h-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c1c"/>
      <stop offset="0.35" stop-color="#2b2013"/>
      <stop offset="1" stop-color="#191207"/>
    </linearGradient>
    <linearGradient id="h-map" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20261e"/>
      <stop offset="1" stop-color="#151a14"/>
    </linearGradient>
    <radialGradient id="h-vig" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0.55" stop-color="#0a0806" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0806" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="760" fill="url(#h-wall)"/>
  <!-- panelling -->
  <g stroke="#241d13" stroke-width="2" opacity="0.7">
    <line x1="100" y1="0" x2="100" y2="700"/>
    <line x1="380" y1="0" x2="380" y2="700"/>
    <line x1="1060" y1="0" x2="1060" y2="700"/>
    <line x1="1340" y1="0" x2="1340" y2="700"/>
  </g>

  <!-- tall window with night skyline -->
  <g>
    <rect x="470" y="50" width="500" height="330" fill="url(#h-window)"/>
    <rect x="470" y="50" width="500" height="330" fill="none" stroke="#3a3226" stroke-width="7"/>
    <line x1="720" y1="50" x2="720" y2="380" stroke="#3a3226" stroke-width="5"/>
    <line x1="470" y1="215" x2="970" y2="215" stroke="#3a3226" stroke-width="5"/>
    <g fill="#0e0b07">
      <rect x="486" y="268" width="66" height="80"/>
      <rect x="572" y="244" width="52" height="104"/>
      <rect x="644" y="282" width="76" height="66"/>
      <rect x="742" y="252" width="58" height="96"/>
      <rect x="822" y="274" width="66" height="74"/>
      <rect x="908" y="240" width="56" height="108"/>
    </g>
    <g fill="#e6cd8e" opacity="0.7">
      <rect x="500" y="286" width="5" height="7"/><rect x="518" y="304" width="5" height="7"/>
      <rect x="588" y="262" width="5" height="7"/><rect x="606" y="288" width="5" height="7"/>
      <rect x="758" y="270" width="5" height="7"/><rect x="776" y="296" width="5" height="7"/>
      <rect x="838" y="290" width="5" height="7"/><rect x="924" y="258" width="5" height="7"/><rect x="942" y="286" width="5" height="7"/>
    </g>
    <g stroke="#e9e2d2" stroke-width="1" opacity="0.12">
      <line x1="500" y1="66" x2="494" y2="112"/>
      <line x1="560" y1="86" x2="554" y2="134"/>
      <line x1="640" y1="60" x2="634" y2="106"/>
      <line x1="700" y1="106" x2="694" y2="156"/>
      <line x1="790" y1="68" x2="784" y2="120"/>
      <line x1="860" y1="102" x2="854" y2="152"/>
      <line x1="930" y1="64" x2="924" y2="110"/>
    </g>
  </g>

  <!-- wall clock (end month) -->
  <g>
    <circle cx="1015" cy="118" r="42" fill="#141009" stroke="#5e543e" stroke-width="5"/>
    <circle cx="1015" cy="118" r="36" fill="none" stroke="#453e2e" stroke-width="1"/>
    <line x1="1015" y1="118" x2="1015" y2="92" stroke="#e6cd8e" stroke-width="3" stroke-linecap="round"/>
    <line x1="1015" y1="118" x2="1032" y2="128" stroke="#c9a96a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1015" cy="118" r="3" fill="#e6cd8e"/>
  </g>

  <!-- wall map of the federation (overview / states) -->
  <g>
    <rect x="118" y="108" width="252" height="196" fill="url(#h-map)" stroke="#5e543e" stroke-width="6"/>
    <g fill="none" stroke="#c9a96a" stroke-width="2.5" stroke-linejoin="round" opacity="0.9">
      <!-- peninsula -->
      <path d="M160 160c18-14 44-20 66-14 20 6 34 20 38 38 4 20-2 40-16 54-16 16-38 22-58 14-20-8-32-26-34-46-2-18 0-34 4-46z"/>
      <!-- borneo -->
      <path d="M262 196c16-12 40-16 60-8 22 8 34 26 32 46-2 22-16 38-36 44-22 6-44-2-56-20-12-18-12-42 0-62z"/>
    </g>
    <g fill="#e6cd8e" opacity="0.9">
      <circle cx="205" cy="185" r="3"/>
      <circle cx="235" cy="205" r="3"/>
      <circle cx="305" cy="235" r="3"/>
    </g>
    <text x="132" y="288" fill="#8d867a" font-family="Public Sans, sans-serif" font-size="14" letter-spacing="3">THE FEDERATION</text>
    <!-- state files stack under the map -->
    <g transform="translate(150 380)">
      <rect x="0" y="16" width="96" height="26" fill="#26314a" stroke="#141009" stroke-width="2" transform="rotate(-3 48 29)"/>
      <rect x="6" y="8" width="96" height="26" fill="#31507a" stroke="#141009" stroke-width="2" transform="rotate(2 54 21)"/>
      <rect x="2" y="0" width="96" height="26" fill="#3f6391" stroke="#141009" stroke-width="2"/>
      <rect x="10" y="6" width="60" height="5" fill="#e9e2d2" opacity="0.75"/>
    </g>
  </g>

  <!-- globe on cabinet (diplomacy) -->
  <g>
    <rect x="52" y="470" width="150" height="150" fill="#1d1710" stroke="#3a3226" stroke-width="4"/>
    <rect x="66" y="484" width="122" height="10" fill="#2a2318"/>
    <circle cx="127" cy="420" r="52" fill="#1e3340" stroke="#c9a96a" stroke-width="3"/>
    <path d="M96 390c20-8 42-6 58 6M86 428c24 10 52 10 76-2" fill="none" stroke="#7fa08c" stroke-width="2.5" opacity="0.85"/>
    <path d="M127 368v104M83 420h88" fill="none" stroke="#c9a96a" stroke-width="1" opacity="0.4"/>
    <ellipse cx="127" cy="482" rx="34" ry="7" fill="#0e0b07"/>
    <path d="M119 472h16l-4 10h-8z" fill="#3a3226"/>
  </g>

  <!-- framed chamber picture (parliament) + standard (parties) -->
  <g>
    <rect x="1096" y="104" width="216" height="150" fill="#141009" stroke="#5e543e" stroke-width="7"/>
    <g fill="#232d3a">
      <path d="M1116 216a88 62 0 0 1 176 0z" transform="translate(0 -14)"/>
    </g>
    <g fill="#5578a5">
      <circle cx="1160" cy="182" r="5"/><circle cx="1180" cy="176" r="5"/><circle cx="1200" cy="172" r="5"/><circle cx="1220" cy="172" r="5"/><circle cx="1240" cy="176" r="5"/><circle cx="1262" cy="182" r="5"/>
    </g>
    <g fill="#4e7d6e">
      <circle cx="1168" cy="196" r="5"/><circle cx="1190" cy="190" r="5"/><circle cx="1212" cy="188" r="5"/><circle cx="1234" cy="190" r="5"/><circle cx="1254" cy="196" r="5"/>
    </g>
    <line x1="1116" y1="216" x2="1292" y2="216" stroke="#c9a96a" stroke-width="2"/>
    <text x="1128" y="240" fill="#8d867a" font-family="Public Sans, sans-serif" font-size="13" letter-spacing="2">DEWAN RAKYAT</text>
  </g>
  <g>
    <line x1="1378" y1="240" x2="1378" y2="96" stroke="#3a3226" stroke-width="6"/>
    <path d="M1352 100h52v150l-26-16-26 16z" fill="#5e2a31" stroke="#141009" stroke-width="3"/>
    <path d="M1378 118l7 14 15 2-11 11 3 15-14-7-14 7 3-15-11-11 15-2z" fill="#e6cd8e" opacity="0.9"/>
  </g>

  <!-- safe (security) -->
  <g>
    <rect x="1120" y="520" width="118" height="112" fill="#20242c" stroke="#141009" stroke-width="4"/>
    <rect x="1136" y="536" width="86" height="80" fill="none" stroke="#5e543e" stroke-width="3"/>
    <circle cx="1179" cy="576" r="17" fill="none" stroke="#c9a96a" stroke-width="3"/>
    <line x1="1179" y1="576" x2="1179" y2="562" stroke="#c9a96a" stroke-width="2.5"/>
    <circle cx="1179" cy="576" r="2.5" fill="#e6cd8e"/>
    <rect x="1198" y="600" width="24" height="8" rx="2" fill="#c9a96a"/>
  </g>

  <!-- bookshelf -->
  <g>
    <rect x="960" y="330" width="118" height="180" fill="#1d1710" stroke="#3a3226" stroke-width="4"/>
    <g stroke="#141009" stroke-width="3">
      <line x1="964" y1="390" x2="1074" y2="390"/>
      <line x1="964" y1="450" x2="1074" y2="450"/>
    </g>
    <g>
      <rect x="972" y="348" width="10" height="38" fill="#5e2a31"/><rect x="984" y="352" width="10" height="34" fill="#31507a"/><rect x="996" y="346" width="10" height="40" fill="#3f6391"/><rect x="1008" y="354" width="10" height="32" fill="#8a6c1f"/><rect x="1020" y="350" width="10" height="36" fill="#4e7d6e"/><rect x="1032" y="356" width="10" height="30" fill="#6e4a7a"/>
      <rect x="972" y="408" width="10" height="38" fill="#31507a"/><rect x="984" y="412" width="10" height="34" fill="#5e2a31"/><rect x="996" y="406" width="10" height="40" fill="#4e7d6e"/><rect x="1008" y="414" width="10" height="32" fill="#8a6c1f"/><rect x="1020" y="408" width="10" height="38" fill="#3f6391"/>
      <rect x="972" y="468" width="44" height="38" fill="#10151d" stroke="#3a3226" stroke-width="2"/>
    </g>
  </g>

  <!-- the desk -->
  <g>
    <ellipse cx="720" cy="470" rx="330" ry="26" fill="url(#h-lamp)"/>
    <rect x="400" y="470" width="640" height="30" fill="url(#h-desk)"/>
    <rect x="400" y="470" width="640" height="8" fill="#4a3826"/>
    <rect x="428" y="500" width="26" height="180" fill="#191207"/>
    <rect x="986" y="500" width="26" height="180" fill="#191207"/>
    <rect x="470" y="500" width="180" height="150" fill="#221a0f" stroke="#191207" stroke-width="3"/>
    <rect x="474" y="504" width="172" height="20" fill="#2b2013"/>
    <circle cx="560" cy="514" r="5" fill="#c9a96a"/>
    <!-- desk phone (cabinet) -->
    <g transform="translate(912 448)">
      <rect x="0" y="8" width="64" height="26" rx="6" fill="#26221c" stroke="#141009" stroke-width="2"/>
      <rect x="10" y="-4" width="30" height="16" rx="6" fill="#332d24"/>
      <line x1="14" y1="12" x2="14" y2="26" stroke="#453e2e" stroke-width="2"/>
      <line x1="52" y1="12" x2="52" y2="26" stroke="#453e2e" stroke-width="2"/>
    </g>
    <!-- red folder stack (briefings) -->
    <g transform="translate(646 430)">
      <rect x="0" y="26" width="112" height="16" fill="#5e2a31" transform="rotate(-2 56 34)"/>
      <rect x="6" y="14" width="112" height="16" fill="#6e3440"/>
      <rect x="2" y="0" width="112" height="16" fill="#8a474e"/>
      <rect x="12" y="4" width="64" height="5" fill="#e9e2d2" opacity="0.7"/>
    </g>
    <!-- journal (history) -->
    <g transform="translate(548 448)">
      <rect x="0" y="4" width="64" height="20" rx="2" fill="#3a2c1c" stroke="#141009" stroke-width="2" transform="rotate(-3 32 14)"/>
      <path d="M6 10c14 6 40 8 54 4" fill="none" stroke="#e6cd8e" stroke-width="1.5" opacity="0.6" transform="rotate(-3 32 14)"/>
    </g>
    <!-- newspaper (news) -->
    <g transform="translate(790 452)">
      <rect x="0" y="0" width="92" height="24" fill="#e9e2d2" transform="rotate(2 46 12)"/>
      <g transform="rotate(2 46 12)" fill="#1d1f25">
        <rect x="8" y="5" width="52" height="5"/>
        <rect x="8" y="14" width="34" height="3" opacity="0.6"/>
        <rect x="8" y="18" width="40" height="2.5" opacity="0.4"/>
        <rect x="66" y="6" width="18" height="14" opacity="0.25"/>
      </g>
    </g>
    <!-- ledger (economy) -->
    <g transform="translate(880 470)">
      <rect x="0" y="0" width="70" height="18" rx="2" fill="#1f4440" stroke="#141009" stroke-width="2"/>
      <rect x="4" y="3" width="10" height="12" fill="#c9a96a" opacity="0.8"/>
      <line x1="20" y1="9" x2="62" y2="9" stroke="#e9e2d2" stroke-width="2" opacity="0.5"/>
    </g>
    <!-- desk lamp -->
    <g>
      <ellipse cx="480" cy="452" rx="46" ry="12" fill="url(#h-lamp)"/>
      <path d="M452 444l28-26 30 24z" fill="#2c8a6a" opacity="0.92"/>
      <rect x="477" y="418" width="6" height="34" fill="#1d1710"/>
      <ellipse cx="480" cy="424" rx="30" ry="10" fill="url(#h-lamp)" opacity="0.8"/>
    </g>
  </g>

  <!-- rug -->
  <ellipse cx="720" cy="712" rx="480" ry="34" fill="#241d13"/>
  <ellipse cx="720" cy="712" rx="420" ry="26" fill="none" stroke="#453e2e" stroke-width="3"/>

  <!-- PM nameplate on desk edge -->
  <g>
    <rect x="618" y="524" width="204" height="34" fill="#141009" stroke="#c9a96a" stroke-width="2"/>
    <text x="720" y="546" text-anchor="middle" fill="#d9b877" font-family="Fraunces, Georgia, serif" font-size="17" letter-spacing="2">THE PRIME MINISTER</text>
  </g>

  <rect width="1440" height="760" fill="url(#h-vig)"/>
</svg>
