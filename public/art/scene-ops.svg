<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised illustration of a crisis operations room with glowing screens">
  <defs>
    <linearGradient id="o-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161d"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <radialGradient id="o-screen" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#2e5f8a"/>
      <stop offset="0.6" stop-color="#1d3d5c"/>
      <stop offset="1" stop-color="#12283e"/>
    </radialGradient>
    <radialGradient id="o-redlamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d98a8f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8a474e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="o-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d232e"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="420" fill="url(#o-wall)"/>

  <!-- main wall of screens -->
  <g>
    <rect x="300" y="46" width="500" height="210" fill="url(#o-screen)" stroke="#0a0e15" stroke-width="8"/>
    <rect x="820" y="46" width="340" height="210" fill="url(#o-screen)" stroke="#0a0e15" stroke-width="8"/>
    <!-- screen 1: the peninsula with track marks -->
    <g stroke="#7fb2d9" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M330 90c60-16 130-10 190 6 70 18 130 20 190 8"/>
      <path d="M330 130c70-10 140-6 210 8 60 12 120 14 170 6"/>
    </g>
    <g fill="#e6cd8e">
      <circle cx="410" cy="104" r="4"/>
      <circle cx="620" cy="118" r="4"/>
      <circle cx="800" cy="128" r="4"/>
    </g>
    <g stroke="#7fb2d9" stroke-opacity="0.5" stroke-width="1">
      <line x1="410" y1="104" x2="470" y2="150"/>
      <line x1="620" y1="118" x2="560" y2="160"/>
    </g>
    <text x="322" y="238" fill="#9fc6e2" font-family="Public Sans, sans-serif" font-size="14" letter-spacing="3" opacity="0.85">SITUATION MAP — LIVE</text>
    <!-- screen 2: radar sweep -->
    <g>
      <circle cx="990" cy="150" r="86" fill="none" stroke="#7fb2d9" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="990" cy="150" r="56" fill="none" stroke="#7fb2d9" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="990" cy="150" r="26" fill="none" stroke="#7fb2d9" stroke-width="1" stroke-opacity="0.3"/>
      <line x1="990" y1="150" x2="1052" y2="108" stroke="#e6cd8e" stroke-width="2" stroke-opacity="0.9"/>
      <circle cx="1044" cy="114" r="3.5" fill="#e6cd8e"/>
      <circle cx="952" cy="176" r="3" fill="#7fb2d9"/>
    </g>
  </g>

  <!-- red status lamp -->
  <g>
    <line x1="1240" y1="0" x2="1240" y2="52" stroke="#1a202a" stroke-width="3"/>
    <circle cx="1240" cy="66" r="10" fill="#8a474e"/>
    <circle cx="1240" cy="66" r="52" fill="url(#o-redlamp)" opacity="0.5"/>
  </g>

  <!-- side silhouettes: racks and cabinets -->
  <g fill="#0d1118">
    <rect x="80" y="120" width="130" height="300"/>
    <rect x="1250" y="180" width="120" height="240"/>
  </g>
  <g fill="#1c2430">
    <rect x="96" y="140" width="98" height="10"/>
    <rect x="96" y="170" width="98" height="10"/>
    <rect x="96" y="200" width="98" height="10"/>
  </g>
  <g fill="#7fb2d9" opacity="0.75">
    <rect x="110" y="144" width="4" height="3"/>
    <rect x="140" y="174" width="4" height="3"/>
    <rect x="170" y="204" width="4" height="3"/>
  </g>

  <!-- operations desk -->
  <g>
    <rect x="430" y="300" width="600" height="30" fill="url(#o-desk)"/>
    <rect x="470" y="330" width="18" height="90" fill="#0e1219"/>
    <rect x="960" y="330" width="18" height="90" fill="#0e1219"/>
    <g fill="#e9e2d2" opacity="0.14">
      <rect x="500" y="286" width="70" height="14" rx="2"/>
      <rect x="700" y="286" width="70" height="14" rx="2"/>
    </g>
    <!-- red phone -->
    <rect x="880" y="284" width="34" height="16" rx="3" fill="#8a474e"/>
    <rect x="888" y="276" width="18" height="10" rx="4" fill="#a3565e"/>
  </g>

  <rect x="0" y="392" width="1440" height="28" fill="#080b10"/>
  <rect x="0" y="392" width="1440" height="2" fill="#2c3441"/>
</svg>
