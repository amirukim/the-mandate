<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised illustration of a flooded Kelantan village under monsoon rain at dusk">
  <defs>
    <linearGradient id="f-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="0.55" stop-color="#26344a"/>
      <stop offset="1" stop-color="#3a4a5e"/>
    </linearGradient>
    <linearGradient id="f-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243448"/>
      <stop offset="1" stop-color="#141d29"/>
    </linearGradient>
    <radialGradient id="f-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6cd8e" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#c9a96a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c9a96a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="420" fill="url(#f-sky)"/>

  <!-- far storm cloud bank -->
  <g fill="#121926" opacity="0.9">
    <ellipse cx="240" cy="52" rx="260" ry="40"/>
    <ellipse cx="700" cy="36" rx="320" ry="44"/>
    <ellipse cx="1200" cy="56" rx="280" ry="42"/>
  </g>
  <!-- distant lightning glow -->
  <rect x="1020" y="60" width="4" height="70" fill="#e9e2d2" opacity="0.35"/>
  <rect x="1016" y="118" width="12" height="4" fill="#e9e2d2" opacity="0.3"/>
  <ellipse cx="1040" cy="150" rx="120" ry="36" fill="#46506a" opacity="0.35"/>

  <!-- rain -->
  <g stroke="#e9e2d2" stroke-width="1.2" opacity="0.16">
    <line x1="60" y1="20" x2="48" y2="90"/>
    <line x1="180" y1="10" x2="168" y2="86"/>
    <line x1="320" y1="30" x2="308" y2="104"/>
    <line x1="470" y1="16" x2="458" y2="92"/>
    <line x1="620" y1="34" x2="608" y2="110"/>
    <line x1="760" y1="18" x2="748" y2="94"/>
    <line x1="900" y1="30" x2="888" y2="106"/>
    <line x1="1040" y1="14" x2="1028" y2="90"/>
    <line x1="1180" y1="30" x2="1168" y2="106"/>
    <line x1="1330" y1="16" x2="1318" y2="92"/>
    <line x1="120" y1="120" x2="110" y2="180"/>
    <line x1="400" y1="130" x2="390" y2="192"/>
    <line x1="700" y1="120" x2="690" y2="184"/>
    <line x1="1000" y1="126" x2="990" y2="188"/>
    <line x1="1300" y1="122" x2="1290" y2="184"/>
  </g>

  <!-- palm silhouettes -->
  <g fill="#0d131c">
    <path d="M150 300c-4-42 0-78 10-108-2 36-2 72 4 108z"/>
    <path d="M158 196c-26-18-52-24-78-22 30-8 60 0 84 14z"/>
    <path d="M160 194c-8-30-24-50-46-62 28 8 48 30 58 56z"/>
    <path d="M162 193c2-32 14-56 36-72-16 24-26 48-28 72z"/>
    <path d="M163 195c24-20 50-28 76-26-30 2-56 10-72 30z"/>
    <path d="M1170 310c-5-46 0-86 12-120-2 40-3 78 4 120z"/>
    <path d="M1180 194c-30-20-58-26-86-24 34-8 66 0 92 16z"/>
    <path d="M1182 192c-8-34-26-56-50-70 30 10 52 34 62 62z"/>
    <path d="M1184 190c2-36 16-62 40-80-18 26-30 52-32 80z"/>
    <path d="M1185 192c26-22 56-30 84-28-32 2-60 12-78 34z"/>
  </g>

  <!-- flooded plain -->
  <rect x="0" y="300" width="1440" height="120" fill="url(#f-water)"/>
  <!-- reflections -->
  <g stroke="#e6cd8e" stroke-width="2" opacity="0.22">
    <line x1="170" y1="306" x2="150" y2="368"/>
    <line x1="1180" y1="312" x2="1158" y2="380"/>
  </g>
  <g stroke="#e9e2d2" stroke-width="1" opacity="0.1">
    <line x1="80" y1="322" x2="240" y2="322"/>
    <line x1="420" y1="344" x2="640" y2="344"/>
    <line x1="840" y1="330" x2="1080" y2="330"/>
    <line x1="1120" y1="366" x2="1400" y2="366"/>
    <line x1="200" y1="382" x2="520" y2="382"/>
  </g>

  <!-- stilt houses on the water -->
  <g>
    <g transform="translate(430 232)">
      <rect x="0" y="0" width="150" height="70" fill="#182231" stroke="#0d131c" stroke-width="2"/>
      <path d="M-8 0l83-34 83 34z" fill="#121a26"/>
      <rect x="58" y="24" width="30" height="46" fill="#0d131c"/>
      <rect x="18" y="18" width="34" height="26" fill="#c9a96a" opacity="0.55"/>
      <g stroke="#0d131c" stroke-width="6">
        <line x1="12" y1="70" x2="12" y2="118"/>
        <line x1="70" y1="70" x2="70" y2="122"/>
        <line x1="132" y1="70" x2="132" y2="116"/>
      </g>
    </g>
    <g transform="translate(960 246)">
      <rect x="0" y="0" width="120" height="56" fill="#16202d" stroke="#0d131c" stroke-width="2"/>
      <path d="M-6 0l66-28 66 28z" fill="#101724"/>
      <rect x="46" y="20" width="26" height="36" fill="#0d131c"/>
      <rect x="14" y="14" width="28" height="22" fill="#c9a96a" opacity="0.45"/>
      <g stroke="#0d131c" stroke-width="6">
        <line x1="14" y1="56" x2="14" y2="104"/>
        <line x1="64" y1="56" x2="64" y2="108"/>
        <line x1="108" y1="56" x2="108" y2="102"/>
      </g>
      <ellipse cx="60" cy="86" rx="46" ry="8" fill="url(#f-lamp)" opacity="0.5"/>
    </g>
  </g>

  <rect x="0" y="410" width="1440" height="10" fill="#0a0e15"/>
</svg>
