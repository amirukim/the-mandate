<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised illustration of a prime minister's office at night">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a20"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6cd8e" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#c9a96a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c9a96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#1c2434"/>
    </linearGradient>
  </defs>

  <!-- wall panelling -->
  <rect width="1440" height="420" fill="url(#wall)"/>
  <g stroke="#202631" stroke-width="2" opacity="0.8">
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="1200" y1="0" x2="1200" y2="420"/>
    <line x1="1320" y1="0" x2="1320" y2="420"/>
  </g>

  <!-- tall window with night city -->
  <g>
    <rect x="470" y="34" width="500" height="270" fill="url(#window)"/>
    <rect x="470" y="34" width="500" height="270" fill="none" stroke="#363d47" stroke-width="6"/>
    <line x1="720" y1="34" x2="720" y2="304" stroke="#363d47" stroke-width="5"/>
    <line x1="470" y1="170" x2="970" y2="170" stroke="#363d47" stroke-width="5"/>
    <!-- distant skyline -->
    <g fill="#0b1018">
      <rect x="470" y="240" width="70" height="64"/>
      <rect x="560" y="220" width="50" height="84"/>
      <rect x="630" y="252" width="80" height="52"/>
      <rect x="740" y="228" width="60" height="76"/>
      <rect x="820" y="246" width="70" height="58"/>
      <rect x="910" y="216" width="60" height="88"/>
    </g>
    <g fill="#e6cd8e" opacity="0.7">
      <rect x="486" y="256" width="5" height="7"/>
      <rect x="504" y="272" width="5" height="7"/>
      <rect x="574" y="238" width="5" height="7"/>
      <rect x="590" y="262" width="5" height="7"/>
      <rect x="756" y="244" width="5" height="7"/>
      <rect x="774" y="268" width="5" height="7"/>
      <rect x="836" y="262" width="5" height="7"/>
      <rect x="926" y="232" width="5" height="7"/>
      <rect x="944" y="258" width="5" height="7"/>
    </g>
    <!-- rain -->
    <g stroke="#e9e2d2" stroke-width="1" opacity="0.14">
      <line x1="500" y1="50" x2="494" y2="96"/>
      <line x1="560" y1="70" x2="554" y2="118"/>
      <line x1="640" y1="44" x2="634" y2="92"/>
      <line x1="700" y1="90" x2="694" y2="140"/>
      <line x1="790" y1="52" x2="784" y2="104"/>
      <line x1="860" y1="86" x2="854" y2="136"/>
      <line x1="930" y1="60" x2="924" y2="110"/>
      <line x1="540" y1="180" x2="534" y2="228"/>
      <line x1="820" y1="190" x2="814" y2="238"/>
      <line x1="900" y1="176" x2="894" y2="222"/>
    </g>
    <!-- curtains -->
    <rect x="430" y="20" width="44" height="300" fill="#141a24"/>
    <rect x="966" y="20" width="44" height="300" fill="#141a24"/>
    <rect x="430" y="20" width="44" height="300" fill="none" stroke="#c9a96a" stroke-opacity="0.25"/>
    <rect x="966" y="20" width="44" height="300" fill="none" stroke="#c9a96a" stroke-opacity="0.25"/>
  </g>

  <!-- desk -->
  <g>
    <rect x="180" y="320" width="1080" height="34" fill="#0e141e"/>
    <rect x="180" y="354" width="1080" height="66" fill="#0a0f16"/>
    <rect x="180" y="320" width="1080" height="4" fill="#c9a96a" opacity="0.55"/>
    <!-- files -->
    <rect x="300" y="296" width="120" height="24" fill="#202631"/>
    <rect x="312" y="284" width="120" height="14" fill="#2a323f"/>
    <rect x="330" y="276" width="86" height="10" fill="#773d43" opacity="0.9"/>
    <!-- telephone -->
    <g fill="#141a24">
      <rect x="1020" y="300" width="70" height="20" rx="4"/>
      <rect x="1034" y="288" width="42" height="14" rx="7"/>
    </g>
    <!-- banker's lamp -->
    <circle cx="720" cy="270" r="150" fill="url(#lampGlow)"/>
    <rect x="716" y="284" width="6" height="36" fill="#0e141e"/>
    <path d="M684 288h64l-10-26h-44z" fill="#2f4638"/>
    <path d="M684 288h64l-10-26h-44z" fill="none" stroke="#c9a96a" stroke-opacity="0.5"/>
    <ellipse cx="716" cy="290" rx="44" ry="7" fill="#e6cd8e" opacity="0.35"/>
    <!-- paper under the lamp -->
    <rect x="640" y="304" width="150" height="16" fill="#e9e2d2" opacity="0.85"/>
    <rect x="648" y="308" width="120" height="2" fill="#363d47" opacity="0.6"/>
    <rect x="648" y="313" width="96" height="2" fill="#363d47" opacity="0.6"/>
  </g>

  <!-- chair silhouette -->
  <g fill="#0a0f16">
    <path d="M120 420v-96c0-30 24-54 54-54h44c30 0 54 24 54 54v96z"/>
  </g>
  <path d="M120 420v-96c0-30 24-54 54-54h44c30 0 54 24 54 54v96" fill="none" stroke="#c9a96a" stroke-opacity="0.3"/>
</svg>
