<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised illustration of the Treasury briefing room, Putrajaya">
  <defs>
    <linearGradient id="t-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d26"/>
      <stop offset="1" stop-color="#0f141d"/>
    </linearGradient>
    <radialGradient id="t-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6cd8e" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#c9a96a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c9a96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="t-col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a212c"/>
      <stop offset="0.5" stop-color="#232d3a"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="420" fill="url(#t-wall)"/>

  <!-- colonnade -->
  <g>
    <rect x="60" y="40" width="56" height="380" fill="url(#t-col)"/>
    <rect x="60" y="40" width="56" height="14" fill="#2a3542"/>
    <rect x="220" y="70" width="44" height="350" fill="url(#t-col)"/>
    <rect x="220" y="70" width="44" height="12" fill="#28313e"/>
    <rect x="1340" y="40" width="56" height="380" fill="url(#t-col)"/>
    <rect x="1340" y="40" width="56" height="14" fill="#2a3542"/>
    <rect x="1190" y="70" width="44" height="350" fill="url(#t-col)"/>
    <rect x="1190" y="70" width="44" height="12" fill="#28313e"/>
  </g>

  <!-- chart board: the deficit line -->
  <g>
    <rect x="420" y="70" width="600" height="200" fill="url(#t-board)" stroke="#363d47" stroke-width="5"/>
    <g stroke="#202835" stroke-width="1">
      <line x1="450" y1="120" x2="990" y2="120"/>
      <line x1="450" y1="160" x2="990" y2="160"/>
      <line x1="450" y1="200" x2="990" y2="200"/>
      <line x1="450" y1="240" x2="990" y2="240"/>
    </g>
    <path d="M470 130 L610 158 L750 146 L890 190 L960 178" fill="none" stroke="#c9a96a" stroke-width="4" stroke-linecap="round"/>
    <g fill="#e6cd8e">
      <circle cx="470" cy="130" r="4"/>
      <circle cx="610" cy="158" r="4"/>
      <circle cx="750" cy="146" r="4"/>
      <circle cx="890" cy="190" r="4"/>
      <circle cx="960" cy="178" r="4"/>
    </g>
    <g stroke="#e6cd8e" stroke-width="1" opacity="0.5">
      <line x1="890" y1="190" x2="890" y2="252"/>
      <line x1="450" y1="252" x2="990" y2="252"/>
    </g>
    <text x="462" y="102" fill="#8d867a" font-family="Public Sans, sans-serif" font-size="15" letter-spacing="3">FISCAL OUTLOOK — CONFIDENTIAL</text>
  </g>

  <!-- long table with ledgers -->
  <g>
    <rect x="380" y="300" width="680" height="26" fill="#1d232e"/>
    <rect x="380" y="300" width="680" height="6" fill="#2c3644"/>
    <rect x="430" y="326" width="20" height="94" fill="#141a22"/>
    <rect x="990" y="326" width="20" height="94" fill="#141a22"/>
    <g fill="#e9e2d2" opacity="0.85">
      <rect x="500" y="288" width="46" height="12" transform="rotate(-4 500 288)"/>
      <rect x="700" y="286" width="46" height="12" transform="rotate(3 700 286)"/>
      <rect x="880" y="290" width="46" height="12" transform="rotate(-2 880 290)"/>
    </g>
    <g fill="#c9a96a" opacity="0.8">
      <rect x="620" y="292" width="14" height="9" rx="1"/>
      <rect x="820" y="292" width="14" height="9" rx="1"/>
    </g>
  </g>

  <!-- twin hanging lamps -->
  <g>
    <line x1="560" y1="0" x2="560" y2="36" stroke="#202631" stroke-width="3"/>
    <path d="M532 36h56l-10 22h-36z" fill="#2c8a6a" opacity="0.9"/>
    <ellipse cx="560" cy="62" rx="26" ry="9" fill="url(#t-lamp)"/>
    <circle cx="560" cy="60" r="5" fill="#e6cd8e"/>
    <line x1="880" y1="0" x2="880" y2="36" stroke="#202631" stroke-width="3"/>
    <path d="M852 36h56l-10 22h-36z" fill="#2c8a6a" opacity="0.9"/>
    <ellipse cx="880" cy="62" rx="26" ry="9" fill="url(#t-lamp)"/>
    <circle cx="880" cy="60" r="5" fill="#e6cd8e"/>
  </g>

  <!-- floor sheen -->
  <rect x="0" y="380" width="1440" height="40" fill="#0b0f16"/>
  <rect x="0" y="380" width="1440" height="2" fill="#39414c"/>
</svg>
